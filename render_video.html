<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { width: 1920px; height: 1080px; display: block; }
    </style>
</head>
<body>
    <canvas id="c" width="1920" height="1080"></canvas>
    <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    // Load screenshots for slides
    const imgUrls = [
        'http://localhost:8080/Screenshots_Usadba/Screenshot_1_Match3_1920x1080.png',
        'http://localhost:8080/Screenshots_Usadba/Screenshot_2_BossBattle_1920x1080.png',
        'http://localhost:8080/Screenshots_Usadba/Screenshot_3_ManorVillage_1920x1080.png',
        'http://localhost:8080/Screenshots_Usadba/Screenshot_4_HeroesSquad_1920x1080.png',
        'http://localhost:8080/Screenshots_Usadba/Screenshot_6_NightSiege_1920x1080.png'
    ];
    
    const titles = [
        ["СТАРОРУССКАЯ УСАДЬБА: ТРИ В РЯД", "Былинная головоломка в русском сказочном стиле"],
        ["СРАЖАЙТЕСЬ СО ЗМЕЕМ ГОРЫНЫЧЕМ!", "Собирайте комбо и сокрушайте былинных боссов"],
        ["ВОЗРОДИТЕ РОДНУЮ УСАДЬБУ!", "Стройте избы, ветряные мельницы, терем и лесопилку"],
        ["ДРУЖИНА СЛАВЯНСКИХ БОГАТЫРЕЙ", "Илья Муромец, Добрыня Никитич и Алёша Попович"],
        ["ДИНАМИЧНЫЕ МИНИ-ИГРЫ И ОСАДЫ", "Рыбалка на Волхове, Ночная Осада и Колесо Велеса"]
    ];

    let images = [];
    let loadedCount = 0;

    imgUrls.forEach((url, i) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
            loadedCount++;
            if (loadedCount === imgUrls.length) {
                startRecording();
            }
        };
        img.src = url;
        images[i] = img;
    });

    function startRecording() {
        const stream = canvas.captureStream(30);
        let mimeType = 'video/mp4;codecs=avc1';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/mp4';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm;codecs=vp9';
        }
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm';
        }

        const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6000000 });
        const chunks = [];

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = async () => {
            const blob = new Blob(chunks, { type: mimeType });
            await fetch('http://localhost:8089/save_video', { method: 'POST', body: blob });
            window.close();
        };

        recorder.start();

        const totalDuration = 15000; // 15 seconds (within 28s limit)
        const startTime = performance.now();

        function renderFrame(now) {
            const elapsed = now - startTime;
            if (elapsed >= totalDuration) {
                recorder.stop();
                return;
            }

            const slideDuration = totalDuration / images.length; // 3.0 sec per slide
            const currentSlide = Math.min(Math.floor(elapsed / slideDuration), images.length - 1);
            const slideProgress = (elapsed % slideDuration) / slideDuration;

            const img = images[currentSlide];
            const [mainTitle, subTitle] = titles[currentSlide];

            // Draw image with gentle cinematic zoom
            const zoom = 1.0 + 0.04 * slideProgress;
            const zw = 1920 * zoom;
            const zh = 1080 * zoom;
            const ox = (1920 - zw) / 2;
            const oy = (1080 - zh) / 2;

            ctx.drawImage(img, ox, oy, zw, zh);

            // Draw animated golden spark particles
            for (let p = 0; p < 25; p++) {
                const px = (p * 79 + elapsed * 0.15) % 1920;
                const py = (p * 47 + Math.sin(elapsed * 0.003 + p) * 50) % 960;
                ctx.fillStyle = "rgba(255, 215, 0, 0.5)";
                ctx.beginPath();
                ctx.arc(px, py, 2.5 + Math.sin(elapsed * 0.005 + p) * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw stylish bottom banner
            ctx.fillStyle = "rgba(20, 10, 5, 0.88)";
            ctx.fillRect(0, 960, 1920, 120);

            ctx.strokeStyle = "#FFD700";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 960);
            ctx.lineTo(1920, 960);
            ctx.stroke();

            // Text
            ctx.textAlign = "center";
            ctx.fillStyle = "#FFD700";
            ctx.font = "bold 44px 'Russo One', sans-serif, Arial";
            ctx.fillText(mainTitle, 960, 1010);

            ctx.fillStyle = "#F5EBE0";
            ctx.font = "26px sans-serif, Arial";
            ctx.fillText(subTitle, 960, 1055);

            requestAnimationFrame(renderFrame);
        }

        requestAnimationFrame(renderFrame);
    }
    </script>
</body>
</html>
